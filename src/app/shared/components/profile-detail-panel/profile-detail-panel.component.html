<div class="card detail-card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span class="detail-title">{{ panel.title }}</span>
    <button class="btn-edit-panel" *ngIf="showEdit" (click)="onEdit()">
      <i class="bi bi-pencil"></i> Edit
    </button>
  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-6" style="border-right: 1px solid #efe9e9;">
        <div class="field-block" *ngFor="let field of panel.leftFields">
          <div class="field-label" *ngIf="field.label">{{ field.label }}</div>
          <div class="field-value">{{ field.value }}</div>
        </div>
      </div>
      <div class="col-6">
        <div class="field-block" *ngFor="let field of panel.rightFields">
          <div class="field-label" *ngIf="field.label">{{ field.label }}</div>
          <div class="field-value">{{ field.value }}</div>
        </div>
      </div>
    </div>
  </div>
  <div class="card-footer text-center">
    <button class="btn btn-view-more" (click)="onViewMore()">VIEW MORE DETAILS</button>
  </div>
</div>
